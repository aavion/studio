name: Pull Request Verification

on:
  pull_request:
    branches: [ "dev-latest" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Lint+Test-Suite / PHP 8.5
            os: ubuntu-latest
            php: '8.5'
            lint: true
          - name: MacOS Compatibility / PHP 8.4
            os: macos-latest
            php: '8.4'
            lint: false
          - name: Windows Compatibility / PHP 8.4
            os: windows-latest
            php: '8.4'
            lint: false
          - name: Linux ARM Compatibility / PHP 8.4
            os: ubuntu-24.04-arm
            php: '8.4'
            lint: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, fileinfo, iconv, intl, pdo_sqlite, xml, curl, json
          tools: composer
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: php bin/init

      - name: Run linters
        if: matrix.lint
        run: php bin/lint

      - name: Run test suite
        run: php bin/phpunit
