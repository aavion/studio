ui:
  setup:
    area: 'Setup'

setup:
  dashboard:
    title: 'Setup'
    status: 'Ersteinrichtung'
    foundation_title: 'Setup-Routine'
    foundation_text: 'Führt dieselbe Setup-Routine aus wie die CLI. Lass den Dry-Run aktiv, um die geplanten Schritte ohne Datei- oder Datenbankänderungen zu prüfen.'
  landing:
    title: 'Willkommen zu %app_name%'
    text: 'Dein neues Projekt wartet auf dich. Wähle eine Sprache, um fortzufahren:'
  header:
    eyebrow: '%app_name% Setup-Wizard'
  chrome:
    label: 'Setup-Navigation'
    stub: 'Setup-Wizard'
  step_title:
    language: 'Willkommen'
    site: 'Grundeinstellungen'
    database: 'Datenbankverbindung'
    admin: 'Administratorkonto'
    review: 'Setup prüfen'
    result: 'Setup-Ergebnis'
  step_intro:
    language: 'Beginne mit der Sprache der Webseite und einer kurzen Umgebungsprüfung.'
    site: 'Lege die öffentlichen Grundeinstellungen fest und wähle, welche Funktionen die neue Webseite direkt nutzen soll.'
    database: 'Wähle, wo Studio seine Daten speichert. SQLite ist für kleine Installationen geeignet; Server-Datenbanken sind für geteilte oder größere Seiten besser.'
    admin: 'Erstelle das erste Administratorkonto. Dieses Konto erhält Eigentümer-Rechte und kann die Seite fertig konfigurieren.'
    review: 'Prüfe die Werte, bevor Setup Dateien schreibt, Migrationen ausführt und die Datenbank befüllt.'
    result: 'Prüfe das Setup-Ergebnis.'
  navigation:
    label: 'Setup-Schritte'
    back: 'Zurück'
    next: 'Weiter'
  message:
    title: 'Setup-Route'
  preflight:
    title: 'Vorabprüfung'
    text: 'Setup prüft die wichtigsten Voraussetzungen, bevor Datenbankdetails abgefragt werden.'
    auto_heal: 'Reparieren'
    auto_heal_hint: 'Setup kann versuchen, die markierten Datei- und Verzeichnisprüfungen automatisch zu reparieren.'
    show_ready_checks: '%count% fertige Prüfungen anzeigen'
    show_details: 'Details anzeigen'
    summary:
      ok: 'Alles Nötige für das Setup ist bereit.'
      warning: 'Setup kann fortfahren, aber eine optionale Server-Funktion benötigt Aufmerksamkeit.'
      healable: 'Setup kann in dieser Umgebung aktuell nicht ausgeführt werden.'
      failed: 'Einige Prüfungen benötigen eine Server- oder PHP-Konfigurationsänderung, bevor das Setup fortfahren kann.'
    errors:
      required: 'Behebe die erforderlichen Prüfungen, bevor du fortfährst.'
      auto_heal_failed: 'Die automatische Reparatur konnte nicht alle erforderlichen Prüfungen beheben.'
    status:
      ok: 'OK'
      failed: 'FEHLER'
      missing: 'Fehlt'
      optional: 'Optional'
      warning: 'WARNUNG'
    values:
      executable: 'ausführbar'
      not_detected: 'nicht erkannt'
      not_writable: 'nicht beschreibbar'
      path: '%path%'
      php_version: 'PHP %version%'
      php_version_requirement: 'PHP %version% (erforderlich: %required% oder neuer)'
      process_functions_available: 'PHP-Prozessfunktionen sind verfügbar'
      process_functions_disabled: 'Deaktiviert: %functions%'
      present: 'vorhanden'
      missing: 'nicht vorhanden'
      safe_mode_disabled: 'Safe Mode ist deaktiviert'
      safe_mode_enabled: 'Safe Mode ist aktiviert'
      unavailable: 'nicht verfügbar'
      binary_not_found: 'PHP-CLI-Binary konnte nicht erkannt werden'
      console_unreadable: 'bin/console des Projekts ist für PHP-CLI nicht lesbar'
      extension_missing: 'PHP-CLI fehlt eine erforderliche Erweiterung'
      not_cli: 'Die aufgelöste PHP-Binary ist keine CLI-Binary'
      php_version_too_old: 'Die PHP-CLI-Version erfüllt die Anforderung nicht'
      process_disabled: 'PHP-Prozessfunktionen sind deaktiviert'
      process_failed: 'PHP-CLI-Validierungsprozess ist fehlgeschlagen'
      project_dir_unreadable: 'Das Projektverzeichnis ist für PHP-CLI nicht lesbar'
      server_config: 'PHP-CLI wird durch die Server-Konfiguration blockiert'
      validation_failed: 'PHP-CLI-Validierung ist fehlgeschlagen'
      writable: 'beschreibbar'
      composer_system: 'System-Composer verfügbar'
      composer_bundled: 'bin/composer verfügbar'
      composer_not_executable: 'bin/composer ist nicht ausführbar'
      tailwind_available: 'automatischer Build verfügbar'
      tailwind_blocked: 'durch Server-Policy blockiert'
      tailwind_not_prepared: 'noch nicht vorbereitet'
      extensions_all_present: 'Alle %count% erforderlichen Erweiterungen sind vorhanden'
      optional_extensions_all_present: 'Alle %count% optionalen Datenbank-Erweiterungen sind vorhanden'
      extensions_missing: 'Fehlt: %extensions%'
      writable_paths_ok: '%count% beschreibbare Pfade sind bereit'
      writable_paths_unavailable: '%paths_count% Pfade nicht beschreibbar'
      writable_paths_blocked: '%paths_count% Pfade benötigen Rechteanpassung'
    checks:
      webroot_public:
        label: 'Public-Webroot'
        help: 'Der Webserver zeigt auf public/.'
        instruction: 'Setze den Document Root des Webservers auf das public/-Verzeichnis des Projekts und lade das Setup neu.'
      var_writable:
        label: 'Runtime-Verzeichnis'
        help: 'Setup kann das Runtime-Verzeichnis erstellen oder reparieren.'
        instruction: 'Mache var/ für den Webserver-Benutzer beschreibbar.'
      environment_writable:
        label: 'Environment-Override'
        help: 'Setup kann die lokale Environment-Override-Datei erstellen.'
        instruction: 'Mache das Projekt-Root ausreichend beschreibbar, damit die lokale Environment-Override-Datei erstellt oder aktualisiert werden kann.'
      runtime_translations_writable:
        label: 'Runtime-Übersetzungen'
        help: 'Setup kann das generierte Übersetzungsverzeichnis erstellen.'
        instruction: 'Mache translations/runtime beschreibbar, damit generierte Kataloge aktualisiert werden können.'
      public_writable:
        label: 'Public-Asset-Verzeichnis'
        help: 'Setup kann das Public-Asset-Verzeichnis erstellen.'
        instruction: 'Mache public/ beschreibbar, während Setup generierte Assets vorbereitet.'
      required_extensions:
        label: 'Erforderliche Erweiterungen'
        help: 'Alle erforderlichen PHP-Erweiterungen sind vorhanden.'
        instruction: 'Installiere oder aktiviere diese erforderlichen PHP-Erweiterungen: %extensions%'
      optional_database_extensions:
        label: 'Datenbank-Erweiterungen'
        help: 'Optionale Datenbank-Erweiterungen sind verfügbar, wenn ihr Treiber gewählt wird.'
        instruction: 'Installiere diese Erweiterungen, wenn du MySQL/MariaDB oder PostgreSQL verwenden möchtest: %extensions%'
      optional_media_extensions:
        label: 'Medien-Erweiterungen'
        help: 'Optionale Medien-Erweiterungen verbessern Bildverarbeitungsfunktionen.'
        instruction: 'Installiere diese Erweiterungen, wenn erweiterte Bildverarbeitung benötigt wird: %extensions%'
      writable_paths:
        label: 'Beschreibbare Pfade'
        help: 'Diese Pfade sind aktuell nicht beschreibbar: %paths%'
        instruction: 'Mache diese Pfade für den Webserver-Benutzer beschreibbar und lade die Prüfung danach neu: %paths%'
      php_version:
        label: 'PHP-Version'
        help: 'Die aktuelle PHP-Laufzeit erfüllt die Projektanforderung.'
        instruction: 'Führe Setup mit einer von composer.json unterstützten PHP-Version aus.'
      safe_mode:
        label: 'PHP Safe Mode'
        help: 'PHP Safe Mode ist deaktiviert.'
        instruction: 'Deaktiviere PHP Safe Mode in der Server-Konfiguration.'
      process_functions:
        label: 'PHP-Prozessfunktionen'
        help: 'Die für Symfony Process benötigten PHP-Funktionen sind verfügbar.'
        instruction: 'Aktiviere die gelisteten PHP-Prozessfunktionen in der php.ini oder im Hosting-Control-Panel: %functions%'
      composer_binary:
        label: 'Composer'
        help: 'Setup kann PHP-Abhängigkeiten installieren und aktualisieren.'
        instruction: 'Installiere Composer global oder stelle bin/composer wieder her.'
      tailwind_build:
        label: 'Tailwind-Build'
        help: 'Automatische Tailwind-Builds sind verfügbar.'
        instruction: 'Automatische Tailwind-Builds sind blockiert. Wenn du Web-Asset-Rebuilds nutzen möchtest, erlaube native Build-Binaries für den Webserver, zum Beispiel durch Deaktivieren von MemoryDenyWriteExecute.'
      cli_runner:
        label: 'PHP-CLI-Binary'
        help: 'Setup kann PHP-CLI-Subprozesse für länger laufende Arbeiten starten.'
        instruction: 'Aktiviere PHP-CLI-Subprozesse oder führe Setup in einer Umgebung aus, die Hintergrundbefehle erlaubt.'
      extension_ctype:
        label: 'PHP-Erweiterung ctype'
        help: 'Wird von Symfony und Validierungsroutinen benötigt.'
        instruction: 'Installiere oder aktiviere die PHP-Erweiterung ctype.'
      extension_fileinfo:
        label: 'PHP-Erweiterung fileinfo'
        help: 'Wird für sichere Datei- und Upload-Verarbeitung benötigt.'
        instruction: 'Installiere oder aktiviere die PHP-Erweiterung fileinfo.'
      extension_iconv:
        label: 'PHP-Erweiterung iconv'
        help: 'Wird für Textnormalisierung benötigt.'
        instruction: 'Installiere oder aktiviere die PHP-Erweiterung iconv.'
      extension_intl:
        label: 'PHP-Erweiterung intl'
        help: 'Wird für lokalisierte Formatierung und Übersetzungen benötigt.'
        instruction: 'Installiere oder aktiviere die PHP-Erweiterung intl.'
      extension_pdo_sqlite:
        label: 'PHP-Erweiterung pdo_sqlite'
        help: 'Wird für das standardmäßige SQLite-Setup-Profil benötigt.'
        instruction: 'Installiere oder aktiviere die PHP-Erweiterung pdo_sqlite, oder konfiguriere später einen anderen Datenbanktreiber.'
      extension_pdo_mysql:
        label: 'PHP-Erweiterung pdo_mysql'
        help: 'Installiere diese Erweiterung, wenn du MySQL oder MariaDB verwendest.'
        instruction: 'Installiere diese Erweiterung, wenn du MySQL oder MariaDB verwendest.'
      extension_pdo_pgsql:
        label: 'PHP-Erweiterung pdo_pgsql'
        help: 'Installiere diese Erweiterung, wenn du PostgreSQL verwendest.'
        instruction: 'Installiere diese Erweiterung, wenn du PostgreSQL verwendest.'
  site:
    title: 'Grundeinstellungen'
    text: 'Diese Werte werden als erste gespeicherte Konfiguration der Seite übernommen. Du kannst sie später im Adminbereich anpassen.'
    settings_title: 'Website-Funktionen'
    behavior_title: 'Website-Funktionen'
    behavior_text: 'Aktiviere nur die Funktionen, die deine Seite direkt nach dem Setup verwenden soll.'
  database:
    title: 'Datenbankverbindung'
    text: 'Teste die Verbindung, bevor du fortfährst. Das optionale Präfix wird mit einem abschließenden Unterstrich gespeichert, wenn es nicht leer ist.'
    test_connection: 'Verbindung testen'
    test_success: 'Die Datenbankverbindung funktioniert.'
    test_failed: 'Die Datenbankverbindung ist fehlgeschlagen. Prüfe die Verbindungsdaten und versuche es erneut.'
    test_invalid: 'Vervollständige gültige Datenbankeinstellungen, bevor du die Verbindung testest.'
  admin:
    title: 'Administratorkonto'
    text: 'Dieses erste Konto wird als Administrator mit Eigentümer-Rechten erstellt. Nutze eine E-Mail-Adresse, auf die du Zugriff hast.'
  app_secret:
    title: 'Hash-Salt'
    text: 'Dieser Wert schützt Passwörter, API-Keys und andere sensible Daten.'
  form:
    language:
      label: 'Sprache der Webseite'
    site_title:
      label: 'Seitentitel'
    default_uri:
      label: 'Website-URL'
    registration_mode:
      label: 'Benutzerregistrierung'
      options:
        disabled: 'Deaktiviert'
        admin_approval: 'Admin-Freigabe'
        auto_approval: 'Automatische Freigabe'
    username_change_enabled:
      label: 'Benutzernamenänderungen erlauben'
    route_prefixes_enabled:
      label: 'Mehrsprachigkeit aktivieren'
    statistics_enabled:
      label: 'Zugriffsstatistiken aktivieren'
    statistics_respect_dnt:
