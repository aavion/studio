        mysql: 'MySQL / MariaDB'
        postgresql: 'PostgreSQL'
    database_url:
      label: 'Datenbank-URL'
      help: 'Leer lassen, damit Setup eine URL aus den Standardwerten des gewählten Treibers erzeugt.'
      sqlite_help: 'Der Standardpfad für SQLite wird empfohlen. Ändere ihn nur, wenn die Datenbank bewusst an einem anderen Ort liegen soll.'
    database_host:
      label: 'Datenbankhost'
    database_port:
      label: 'Datenbankport'
    database_name:
      label: 'Datenbankname'
    database_user:
      label: 'Datenbankbenutzer'
    database_password:
      label: 'Datenbankpasswort'
    database_prefix:
      label: 'Tabellenpräfix'
      help: 'Optionales Präfix für gemeinsam genutzte Datenbankschemas. Das Formular hängt vor dem Speichern einen Unterstrich an; leer lassen für kein Präfix.'
    admin_username:
      label: 'Admin-Benutzername'
    admin_password:
      label: 'Admin-Passwort'
      help: 'Nutze mindestens 8 Zeichen und erfülle die Passwort-Policy.'
      keep_help: 'Leer lassen, um das bereits in dieser Setup-Sitzung eingegebene Passwort zu behalten.'
    admin_password_confirm:
      label: 'Admin-Passwort bestätigen'
    admin_email:
      label: 'Admin-E-Mail'
    app_secret:
      label: 'Kennwort für sensible Daten'
      help: 'Leer lassen, damit Setup automatisch einen sicheren Wert erzeugt. Eine spätere Änderung wird nicht empfohlen, weil dadurch Passwort-Hashes und API-Keys ungültig werden.'
    dry_run:
      label: 'Nur Dry-Run'
      help: 'Zeigt die geplanten Setup-Schritte, ohne Dateien zu schreiben, Migrationen auszuführen oder Daten anzulegen.'
    submit: 'Setup ausführen'
    apply: 'Setup anwenden'
    errors:
      choice: 'Wähle eine der verfügbaren Optionen.'
      database_prefix: 'Nutze ein kleingeschriebenes Präfix, das mit einem Buchstaben beginnt und nur Kleinbuchstaben, Ziffern und Unterstriche enthält.'
      database_url: 'Gib eine unterstützte Datenbank-URL ein, zum Beispiel sqlite:///var/data.db, mysql://user:pass@host/db oder postgresql://user:pass@host/db.'
      email: 'Gib eine gültige E-Mail-Adresse ein.'
      invalid: 'Die gesendeten Setup-Daten konnten nicht verwendet werden.'
      invalid_csrf: 'Das Setup-Formular ist abgelaufen. Bitte versuche es erneut.'
      password_mismatch: 'Die Passwortbestätigung stimmt nicht überein.'
      password_length: 'Das Admin-Passwort muss mindestens 8 Zeichen enthalten.'
      password_complexity: 'Das Admin-Passwort muss mindestens drei Zeichentypen verwenden.'
      password_repeated: 'Das Admin-Passwort darf dasselbe Zeichen nicht mehr als dreimal direkt hintereinander enthalten.'
      password_personal: 'Das Admin-Passwort darf Admin-Username oder E-Mail-Name nicht enthalten.'
      app_secret_length: 'Der Hash-Salt muss mindestens 32 Zeichen enthalten, wenn er gesetzt wird.'
      port: 'Gib einen Port zwischen 1 und 65535 ein.'
      username: 'Der Admin-Username muss mit einem Buchstaben beginnen und 5 bis 30 Buchstaben, Ziffern, Bindestriche oder Unterstriche enthalten.'
      required: 'Dieses Feld ist erforderlich.'
      url: 'Gib eine gültige URL ein.'
  review:
    title: 'Setup prüfen'
