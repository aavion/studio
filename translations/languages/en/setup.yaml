    site: 'Basic settings'
    database: 'Database connection'
    admin: 'Administrator account'
    review: 'Review setup'
    result: 'Setup result'
  step_intro:
    language: 'Start with the website language and a short environment check.'
    site: 'Set the public site basics and choose which features the new website should use right away.'
    database: 'Choose where Studio stores its data. SQLite is fine for small installations; server databases are better for shared or larger sites.'
    admin: 'Create the first administrator account. This account receives owner permissions and can finish configuring the site.'
    review: 'Review the values before setup writes files, runs migrations, and seeds the database.'
    result: 'Review the setup result.'
  navigation:
    label: 'Setup steps'
    back: 'Back'
    next: 'Continue'
  message:
    title: 'Setup route'
  preflight:
    title: 'Preflight checks'
    text: 'Setup checks the essentials before asking for database details.'
    auto_heal: 'Repair'
    auto_heal_hint: 'Setup can try to repair the highlighted file and directory checks automatically.'
    show_ready_checks: 'Show %count% ready checks'
    show_details: 'Show details'
    summary:
      ok: 'Everything needed for setup is ready.'
      warning: 'Setup can continue, but one optional server feature needs attention.'
      healable: 'Setup cannot currently run in this environment.'
      failed: 'Some checks need a server or PHP configuration change before setup can continue.'
    errors:
      required: 'Resolve the required checks before continuing.'
      auto_heal_failed: 'Automatic repair could not resolve every required check.'
    status:
      ok: 'OK'
      failed: 'ERROR'
      missing: 'Missing'
      optional: 'Optional'
      warning: 'WARN'
    values:
      executable: 'executable'
      not_detected: 'not detected'
      not_writable: 'not writable'
      path: '%path%'
      php_version: 'PHP %version%'
      php_version_requirement: 'PHP %version% (required: %required% or newer)'
      process_functions_available: 'PHP process functions are available'
      process_functions_disabled: 'Disabled: %functions%'
      present: 'present'
      missing: 'missing'
      safe_mode_disabled: 'safe mode is disabled'
      safe_mode_enabled: 'safe mode is enabled'
      unavailable: 'unavailable'
      binary_not_found: 'PHP CLI binary could not be detected'
      console_unreadable: 'project bin/console is not readable by PHP CLI'
      extension_missing: 'PHP CLI misses a required extension'
      not_cli: 'resolved PHP binary is not a CLI binary'
      php_version_too_old: 'PHP CLI version does not satisfy the requirement'
      process_disabled: 'PHP process functions are disabled'
      process_failed: 'PHP CLI validation process failed'
      project_dir_unreadable: 'project directory is not readable by PHP CLI'
      server_config: 'PHP CLI is blocked by the server configuration'
      validation_failed: 'PHP CLI validation failed'
      writable: 'writable'
      composer_system: 'system Composer available'
      composer_bundled: 'bin/composer available'
      composer_not_executable: 'bin/composer is not executable'
      tailwind_available: 'automatic build available'
      tailwind_blocked: 'blocked by server policy'
      tailwind_not_prepared: 'not prepared yet'
      extensions_all_present: 'All %count% required extensions are available'
      optional_extensions_all_present: 'All %count% optional database extensions are available'
      extensions_missing: 'Missing: %extensions%'
      writable_paths_ok: '%count% writable paths are ready'
      writable_paths_unavailable: '%paths_count% paths are not writable'
      writable_paths_blocked: '%paths_count% paths need permission changes'
    checks:
      webroot_public:
        label: 'Public webroot'
        help: 'The web server points to public/.'
        instruction: 'Point the web server document root to the project public/ directory, then reload setup.'
      var_writable:
        label: 'Runtime directory'
        help: 'Setup can create or fix the runtime directory.'
        instruction: 'Make var/ writable for the web-server user.'
      environment_writable:
        label: 'Environment override'
        help: 'Setup can create the local environment override file.'
        instruction: 'Make the project root writable enough to create or update the local environment override file.'
      runtime_translations_writable:
        label: 'Runtime translations'
        help: 'Setup can create the generated translation directory.'
        instruction: 'Make translations/runtime writable so generated catalogues can be refreshed.'
      public_writable:
        label: 'Public asset directory'
        help: 'Setup can create the public asset directory.'
        instruction: 'Make public/ writable while setup prepares generated assets.'
      required_extensions:
        label: 'Required extensions'
        help: 'All required PHP extensions are available.'
        instruction: 'Install or enable these required PHP extensions: %extensions%'
      optional_database_extensions:
        label: 'Database extensions'
        help: 'Optional database extensions are available when their driver is selected.'
        instruction: 'Install these extensions when using MySQL/MariaDB or PostgreSQL: %extensions%'
      optional_media_extensions:
        label: 'Media extensions'
        help: 'Optional media extensions improve image processing features.'
        instruction: 'Install these extensions when advanced image processing is needed: %extensions%'
      writable_paths:
        label: 'Writable paths'
        help: 'These paths are currently not writable: %paths%'
        instruction: 'Make these paths writable for the web-server user, then reload the check: %paths%'
      php_version:
        label: 'PHP version'
        help: 'The current PHP runtime satisfies the project requirement.'
        instruction: 'Run setup with a PHP version supported by composer.json.'
      safe_mode:
        label: 'PHP safe mode'
        help: 'PHP safe mode is disabled.'
        instruction: 'Disable PHP safe mode in the server configuration.'
      process_functions:
        label: 'PHP process functions'
        help: 'The PHP functions required for Symfony Process are available.'
        instruction: 'Enable the listed PHP process functions in php.ini or the hosting control panel: %functions%'
      composer_binary:
        label: 'Composer'
        help: 'Setup can install and refresh PHP dependencies.'
        instruction: 'Install Composer globally or restore bin/composer.'
      tailwind_build:
        label: 'Tailwind build'
        help: 'Automatic Tailwind builds are available.'
        instruction: 'Automatic Tailwind builds are blocked. If you want web-triggered asset rebuilds, allow native build binaries for the web server, for example by disabling MemoryDenyWriteExecute.'
      cli_runner:
        label: 'PHP CLI binary'
        help: 'Setup can start PHP CLI subprocesses for long-running work.'
        instruction: 'Enable PHP CLI subprocesses, or run setup from an environment that allows background commands.'
      extension_ctype:
        label: 'PHP extension ctype'
        help: 'Required by Symfony and validation routines.'
        instruction: 'Install or enable the PHP ctype extension.'
      extension_fileinfo:
        label: 'PHP extension fileinfo'
        help: 'Required for safe file and upload handling.'
        instruction: 'Install or enable the PHP fileinfo extension.'
      extension_iconv:
        label: 'PHP extension iconv'
        help: 'Required for text normalization.'
        instruction: 'Install or enable the PHP iconv extension.'
      extension_intl:
        label: 'PHP extension intl'
        help: 'Required for locale-aware formatting and translations.'
        instruction: 'Install or enable the PHP intl extension.'
      extension_pdo_sqlite:
        label: 'PHP extension pdo_sqlite'
        help: 'Required for the default SQLite setup profile.'
        instruction: 'Install or enable the PHP pdo_sqlite extension, or configure another database driver later.'
      extension_pdo_mysql:
        label: 'PHP extension pdo_mysql'
        help: 'Install this extension when using MySQL or MariaDB.'
        instruction: 'Install this extension when using MySQL or MariaDB.'
      extension_pdo_pgsql:
        label: 'PHP extension pdo_pgsql'
        help: 'Install this extension when using PostgreSQL.'
        instruction: 'Install this extension when using PostgreSQL.'
  site:
    title: 'Basic settings'
    text: 'These values become the first persisted configuration for the site. You can adjust them later in the admin area.'
    settings_title: 'Website features'
    behavior_title: 'Website features'
    behavior_text: 'Enable only the features your site should use immediately after setup.'
  database:
    title: 'Database connection'
    text: 'Test the connection before continuing. The optional prefix is saved with one trailing underscore when it is not empty.'
    test_connection: 'Test connection'
    test_success: 'Database connection works.'
    test_failed: 'Database connection failed. Check the connection data and try again.'
    test_invalid: 'Complete valid database settings before testing the connection.'
  admin:
    title: 'Administrator account'
    text: 'This first account is created as the owner-level administrator. Use an email address you can access.'
  app_secret:
    title: 'Hash salt'
    text: 'This value protects passwords, API keys, and other sensitive data.'
  form:
    language:
      label: 'Website language'
    site_title:
      label: 'Site title'
    default_uri:
      label: 'Site URL'
    registration_mode:
      label: 'User registration'
    username_change_enabled:
      label: 'Allow username changes'
    route_prefixes_enabled:
      label: 'Enable multilingual features'
    statistics_enabled:
      label: 'Enable access statistics'
    statistics_respect_dnt:
      label: 'Respect Do Not Track for website visitors'
    database_driver:
      label: 'Database driver'
      options:
        sqlite: 'SQLite'
        mysql: 'MySQL / MariaDB'
        postgresql: 'PostgreSQL'
    database_url:
      label: 'Database URL'
      help: 'Leave empty to let setup build a URL from the selected driver defaults.'
      sqlite_help: 'The default SQLite path is recommended. Change it only when you intentionally keep the database somewhere else.'
    database_host:
      label: 'Database host'
    database_port:
      label: 'Database port'
    database_name:
      label: 'Database name'
    database_user:
      label: 'Database user'
    database_password:
      label: 'Database password'
    database_prefix:
      label: 'Table prefix'
      help: 'Optional prefix for shared database schemas. The form appends an underscore before saving; leave empty for no prefix.'
    admin_username:
      label: 'Admin username'
    admin_password:
      label: 'Admin password'
      help: 'Use at least 8 characters and meet the password policy.'
      keep_help: 'Leave blank to keep the password already entered in this setup session.'
    admin_password_confirm:
      label: 'Confirm admin password'
    admin_email:
      label: 'Admin email'
    app_secret:
      label: 'Secret used for sensitive data'
      help: 'Leave empty so setup automatically generates a secure value. Changing this value later is not recommended because it invalidates password hashes and API keys.'
    dry_run:
      label: 'Dry run only'
      help: 'Show planned setup steps without writing files, running migrations, or seeding data.'
    submit: 'Run setup'
    apply: 'Apply setup'
    errors:
      choice: 'Choose one of the available options.'
      database_prefix: 'Use a lowercase prefix that starts with a letter and contains only lowercase letters, digits, and underscores.'
      database_url: 'Enter a supported database URL such as sqlite:///var/data.db, mysql://user:pass@host/db, or postgresql://user:pass@host/db.'
      email: 'Enter a valid email address.'
      invalid: 'The submitted setup data could not be used.'
      invalid_csrf: 'The setup form expired. Please try again.'
      password_mismatch: 'The password confirmation does not match.'
      password_length: 'The admin password must contain at least 8 characters.'
      password_complexity: 'The admin password must use at least three character types.'
      password_repeated: 'The admin password must not repeat the same character more than three times in a row.'
      password_personal: 'The admin password must not contain the admin username or email name.'
      app_secret_length: 'The hash salt must contain at least 32 characters when provided.'
      port: 'Enter a port between 1 and 65535.'
      username: 'The admin username must start with a letter and contain 5 to 30 letters, digits, hyphens, or underscores.'
      required: 'This field is required.'
      url: 'Enter a valid URL.'
