monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - message
        - audit
        - access
    handlers:
        message:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%/message.log"
            level: debug
            max_files: 30
            channels: ["message"]
        audit:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%/audit.log"
            level: info
            max_files: 30
            channels: ["audit"]
        access:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%/access.log"
            level: info
            max_files: 30
            channels: ["access"]

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!message", "!audit", "!access"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!message", "!audit", "!access"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!message", "!audit", "!access"]
                buffer_size: 50
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!message", "!audit", "!access"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!message", "!audit", "!access"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
