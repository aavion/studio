monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - studio_message
        - studio_audit
        - studio_access
    handlers:
        studio_message:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.studio-message.log"
            level: debug
            max_files: 30
            channels: ["studio_message"]
        studio_audit:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.studio-audit.log"
            level: info
            max_files: 30
            channels: ["studio_audit"]
        studio_access:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.studio-access.log"
            level: info
            max_files: 30
            channels: ["studio_access"]

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!studio_message", "!studio_audit", "!studio_access"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!studio_message", "!studio_audit", "!studio_access"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!studio_message", "!studio_audit", "!studio_access"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!studio_message", "!studio_audit", "!studio_access"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!studio_message", "!studio_audit", "!studio_access"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
