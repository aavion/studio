monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - system_message
        - system_audit
        - system_access
    handlers:
        system_message:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.system-message.log"
            level: debug
            max_files: 30
            channels: ["system_message"]
        system_audit:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.system-audit.log"
            level: info
            max_files: 30
            channels: ["system_audit"]
        system_access:
            type: rotating_file
            path: "%kernel.logs_dir%/%kernel.environment%.system-access.log"
            level: info
            max_files: 30
            channels: ["system_access"]

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!system_message", "!system_audit", "!system_access"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!system_message", "!system_audit", "!system_access"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!system_message", "!system_audit", "!system_access"]
                buffer_size: 50
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!system_message", "!system_audit", "!system_access"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!system_message", "!system_audit", "!system_access"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
