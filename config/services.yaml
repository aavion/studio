# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Parameters for container behavior
    .container.dumper.inline_factories: true # Inline factories to optimize performance by reducing the number of service definitions.
    debug.container.dump: false # Disable dumping the container for debugging to improve performance.
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Core\Event\EventHookDescriptorProviderInterface:
            tags:
                - { name: 'studio.event_hook_provider', priority: 0 }
        App\Backend\BackendViewProviderInterface:
            tags:
                - { name: 'studio.backend_view_provider', priority: 0 }
        App\View\Injection\StaticViewInjectionProviderInterface:
            tags:
                - { name: 'studio.static_view_injection_provider', priority: 0 }
        App\View\Injection\DynamicViewInjectionProviderInterface:
            tags:
                - { name: 'studio.dynamic_view_injection_provider', priority: 0 }
        App\Core\Package\Settings\PackageSettingProviderInterface:
            tags:
                - { name: 'studio.package_setting_provider', priority: 0 }
        App\Core\Operation\Live\LiveOperationQueueProviderInterface:
            tags:
                - { name: 'studio.live_operation_queue_provider', priority: 0 }
        App\Scheduler\SchedulerTaskProviderInterface:
            tags:
                - { name: 'studio.scheduler_task_provider', priority: 0 }
        App\Scheduler\SchedulerTaskExecutorInterface:
            tags:
                - { name: 'studio.scheduler_task_executor', priority: 0 }
        App\Scheduler\SchedulerActionQueueProviderInterface:
            tags:
                - { name: 'studio.scheduler_action_queue_provider', priority: 0 }
        App\Scheduler\SchedulerCallableProviderInterface:
            tags:
                - { name: 'studio.scheduler_callable_provider', priority: 0 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/**/*Action.php'
            - '../src/**/*Actor.php'
            - '../src/**/*Capability.php'
            - '../src/**/*Change.php'
            - '../src/**/*Contribution.php'
            - '../src/**/*Definition.php'
            - '../src/**/*Descriptor.php'
            - '../src/**/*Diff.php'
            - '../src/**/*Entry.php'
            - '../src/**/*Event.php'
            - '../src/**/*Exception.php'
            - '../src/**/*Execution.php'
            - '../src/**/*Field.php'
            - '../src/**/*Identity.php'
            - '../src/**/*Interface.php'
            - '../src/**/*Item.php'
            - '../src/**/*Message.php'
            - '../src/**/*Mode.php'
            - '../src/**/*Package.php'
            - '../src/**/*Path.php'
            - '../src/**/*Plan.php'
            - '../src/**/*Queue.php'
            - '../src/**/*Result.php'
            - '../src/**/*Rule.php'
            - '../src/**/*Scope.php'
            - '../src/**/*Source.php'
            - '../src/Core/Package/PackageSpec.php'
            - '../src/**/*Spec.php'
            - '../src/**/*Status.php'
            - '../src/**/*Type.php'
            - '../src/Kernel.php'

    App\Setup\SetupCommandExecutorInterface:
        alias: App\Setup\ProcessSetupCommandExecutor

    App\Setup\SetupRunner:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Setup\SetupRedirectSubscriber:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Setup\SetupWebInputFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Controller\SetupController:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Backend\BackendRouteResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Diagnostics\SystemInfoProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Backend\BackendViewRegistry:
        arguments:
            $providers: !tagged_iterator { tag: studio.backend_view_provider }

    App\View\Injection\ViewInjectionRegistry:
        arguments:
            $staticProviders: !tagged_iterator { tag: studio.static_view_injection_provider }
            $dynamicProviders: !tagged_iterator { tag: studio.dynamic_view_injection_provider }

    App\Core\Package\Settings\PackageSettingRegistry:
        arguments:
            $providers: !tagged_iterator { tag: studio.package_setting_provider }

    App\Scheduler\SchedulerTaskRegistry:
        arguments:
            $providers: !tagged_iterator { tag: studio.scheduler_task_provider }

    App\Scheduler\SchedulerRunner:
        arguments:
            $executors: !tagged_iterator { tag: studio.scheduler_task_executor }

    App\Scheduler\SchedulerLockFactory:
        arguments:
            $environment: '%kernel.environment%'

    App\Scheduler\CommandSchedulerTaskExecutor:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Scheduler\ActionQueueSchedulerTaskExecutor:
        arguments:
            $providers: !tagged_iterator { tag: studio.scheduler_action_queue_provider }

    App\Scheduler\CallableSchedulerTaskExecutor:
        arguments:
            $providers: !tagged_iterator { tag: studio.scheduler_callable_provider }

    App\Localization\TranslationLanguageCatalog:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $preferredDefaultLanguage: '%kernel.default_locale%'

    App\Core\Translation\TranslationRuntimePath:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Package\PackageAssetSyncer:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Core\Translation\TranslationCatalogueAggregator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Core\Package\PackageRegistryHandler:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $validationSpec: null

    App\Database\DatabaseReadyState:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Package\PackageDiscoveryRunner:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Package\PackageRemover:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Core\Package\Install\PackageZipInstaller:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Package\PackageFaultResetter:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Core\Package\PackagePhpLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $runtimeContributions: '@App\Core\Package\PackageRuntimeContributionRegistry'

    App\Core\Package\PackageRuntimeFailureHandler:
        arguments:
            $environment: '%kernel.environment%'

    App\Core\Event\PublicEventHookRegistry:
        arguments:
            $providers: !tagged_iterator { tag: studio.event_hook_provider }

    App\Core\Package\ActivePackageAssetProviderInterface:
        alias: App\Core\Package\ActivePackageAssetProvider

    App\Core\Package\ActivePackageProviderInterface:
        alias: App\Core\Package\ActivePackageProvider

    App\Core\Package\PackageLifecycleAssetRebuilderInterface:
        alias: App\Core\Package\PackageLifecycleAssetRebuilder

    App\Core\Package\PackageLifecycleCleanupRunnerInterface:
        alias: App\Core\Package\PackageLifecycleCleanupRunner

    App\Core\Messenger\DeferredMessengerDrainStarterInterface:
        alias: App\Core\Messenger\DeferredMessengerDrainProcessStarter

    App\Core\Messenger\DeferredMessengerDrain:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $transportDsn: '%env(MESSENGER_TRANSPORT_DSN)%'

    App\Core\Log\MessageLoggerInterface:
        alias: App\Core\Log\MonologMessageLogger

    App\Core\Log\AuditLoggerInterface:
        alias: App\Core\Log\AuditLogger

    App\Core\Log\AuditLogPolicyInterface:
        alias: App\Core\Log\ConfigAuditLogPolicy

    App\Core\Log\AccessLoggerInterface:
        alias: App\Core\Log\AccessLogger

    App\Core\Geo\GeoIpResolverInterface:
        alias: App\Core\Geo\NullGeoIpResolver

    App\Core\Log\OperationLoggerInterface:
        alias: App\Core\Log\OperationLogger

    App\Core\Message\MessageReporterInterface:
        alias: App\Core\Message\MessageReporter

    App\Core\Message\WorkflowResultMessageReporterInterface:
        alias: App\Core\Message\WorkflowResultMessageReporter

    App\Core\Log\MonologMessageLogger:
        arguments:
            $logger: '@monolog.logger.studio_message'

    App\Core\Log\AuditLogger:
        arguments:
            $logger: '@monolog.logger.studio_audit'

    App\Core\Log\AccessLogger:
        arguments:
            $logger: '@monolog.logger.studio_access'

    App\Core\Statistics\VisitorIdGenerator:
        arguments:
            $secret: '%kernel.secret%'

    App\Core\Security\SecretPayloadProtector:
        arguments:
            $secret: '%kernel.secret%'

    App\Security\AppSecretRotationGuard:
        arguments:
            $secret: '%kernel.secret%'
            $environment: '%kernel.environment%'

    App\Security\AccountLinkDeliveryInterface:
        alias: App\Security\MessageLogAccountLinkDelivery

    App\Core\Log\LogFileBrowser:
        arguments:
            $logDir: '%kernel.logs_dir%'
            $environment: '%kernel.environment%'

    App\Core\Statistics\AccessStatisticsRecorderInterface:
        alias: App\Core\Statistics\DatabaseAccessStatisticsRecorder

    App\Core\Statistics\AccessStatisticsStoreInterface:
        alias: App\Core\Statistics\FileAccessStatisticsStore

    App\Core\Statistics\FileAccessStatisticsStore:
        arguments:
            $statisticsDir: '%kernel.project_dir%/var/statistics'
            $environment: '%kernel.environment%'

    App\Core\Asset\AssetRebuildQueueFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Core\Operation\Live\LiveOperationRunStore:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'
            $operationLogger: '@App\Core\Log\OperationLoggerInterface'

    App\Core\Operation\Live\LiveOperationQueueFactory:
        arguments:
            $providers: !tagged_iterator { tag: studio.live_operation_queue_provider }

    App\Security\MaintenanceModeSubscriber:
        arguments:
            $maintenanceEnabled: '%env(bool:APP_MAINTENANCE)%'

    App\View\SystemPackageMetadataProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Debug\StudioDebugCollector:
        arguments:
            $debug: '%kernel.debug%'

    App\View\Template\PackageTemplatePathResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\View\Http\HttpErrorRenderer:
        arguments:
            $debug: '%kernel.debug%'

    App\View\Http\HttpErrorSubscriber:
        arguments:
            $debug: '%kernel.debug%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
