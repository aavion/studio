# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Parameters for container behavior
    .container.dumper.inline_factories: true # Inline factories to optimize performance by reducing the number of service definitions.
    debug.container.dump: false # Disable dumping the container for debugging to improve performance.
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Api\Endpoint\ApiEndpointProviderInterface:
            tags:
                - { name: 'system.api_endpoint_provider', priority: 0 }
        App\Api\Endpoint\ApiEndpointHandlerInterface:
            tags:
                - { name: 'system.api_endpoint_handler', priority: 0 }
        App\Api\Endpoint\ApiEndpointHandlerProviderInterface:
            tags:
                - { name: 'system.api_endpoint_handler', priority: 0 }
        App\Live\LiveEndpointProviderInterface:
            tags:
                - { name: 'system.live_endpoint_provider', priority: 0 }
        App\Live\LiveEndpointHandlerInterface:
            tags:
                - { name: 'system.live_endpoint_handler', priority: 0 }
        App\Live\LiveEndpointHandlerProviderInterface:
            tags:
                - { name: 'system.live_endpoint_handler', priority: 0 }
        App\Privacy\Cookie\CookieConsentProviderInterface:
            tags:
                - { name: 'system.cookie_consent_provider', priority: 0 }
        App\Core\Event\EventHookDescriptorProviderInterface:
            tags:
                - { name: 'system.event_hook_provider', priority: 0 }
        App\Backend\BackendViewProviderInterface:
            tags:
                - { name: 'system.backend_view_provider', priority: 0 }
        App\View\Injection\StaticViewInjectionProviderInterface:
            tags:
                - { name: 'system.static_view_injection_provider', priority: 0 }
        App\View\Injection\DynamicViewInjectionProviderInterface:
            tags:
                - { name: 'system.dynamic_view_injection_provider', priority: 0 }
        App\Core\Package\Settings\PackageSettingProviderInterface:
            tags:
                - { name: 'system.package_setting_provider', priority: 0 }
        App\Core\Operation\Live\LiveOperationQueueProviderInterface:
            tags:
                - { name: 'system.live_operation_queue_provider', priority: 0 }
        App\Scheduler\SchedulerTaskProviderInterface:
            tags:
                - { name: 'system.scheduler_task_provider', priority: 0 }
        App\Scheduler\SchedulerTaskExecutorInterface:
            tags:
                - { name: 'system.scheduler_task_executor', priority: 0 }
        App\Scheduler\SchedulerActionQueueProviderInterface:
            tags:
                - { name: 'system.scheduler_action_queue_provider', priority: 0 }
        App\Scheduler\SchedulerCallableProviderInterface:
            tags:
                - { name: 'system.scheduler_callable_provider', priority: 0 }
        App\Security\AclGroupReferenceProviderInterface:
            tags:
                - { name: 'system.acl_group_reference_provider', priority: 0 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/**/*Action.php'
            - '../src/**/*Actor.php'
            - '../src/**/*Capability.php'
            - '../src/**/*Change.php'
            - '../src/Api/Http/ApiRequestContext.php'
            - '../src/**/*Contribution.php'
            - '../src/**/*Definition.php'
            - '../src/**/*Descriptor.php'
            - '../src/**/*Diff.php'
            - '../src/**/*Entry.php'
            - '../src/**/*Event.php'
            - '../src/**/*Exception.php'
            - '../src/**/*Execution.php'
            - '../src/**/*Field.php'
            - '../src/**/*Identity.php'
            - '../src/**/*Interface.php'
            - '../src/**/*Item.php'
            - '../src/**/*Message.php'
            - '../src/**/*Mode.php'
            - '../src/**/*Package.php'
            - '../src/**/*Path.php'
            - '../src/**/*Plan.php'
            - '../src/**/*Queue.php'
            - '../src/**/*Result.php'
            - '../src/**/*Rule.php'
            - '../src/**/*Scope.php'
            - '../src/**/*Source.php'
            - '../src/Debug/RouteRenderOptions.php'
            - '../src/Core/Package/PackageSpec.php'
            - '../src/**/*Spec.php'
            - '../src/**/*Status.php'
            - '../src/**/*Type.php'
            - '../src/Security/AdminGroupListQuery.php'
            - '../src/Security/AdminUserListQuery.php'
            - '../src/Security/AdminUserReviewQuery.php'
            - '../src/Kernel.php'

