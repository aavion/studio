    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/**/*Action.php'
            - '../src/**/*Actor.php'
            - '../src/**/*Capability.php'
            - '../src/**/*Change.php'
            - '../src/Api/Http/ApiRequestContext.php'
            - '../src/Core/Extension/extension_functions.php'
            - '../src/**/*Contribution.php'
            - '../src/**/*Definition.php'
            - '../src/**/*Descriptor.php'
            - '../src/**/*Diff.php'
            - '../src/**/*Entry.php'
            - '../src/**/*Event.php'
            - '../src/**/*Exception.php'
            - '../src/**/*Execution.php'
            - '../src/**/*Field.php'
            - '../src/**/*Identity.php'
            - '../src/**/*Interface.php'
            - '../src/**/*Item.php'
            - '../src/**/*Message.php'
            - '../src/**/*Mode.php'
            - '../src/**/*Path.php'
            - '../src/**/*Plan.php'
            - '../src/**/*Queue.php'
            - '../src/**/*Result.php'
            - '../src/**/*Rule.php'
            - '../src/**/*Scope.php'
            - '../src/**/*Source.php'
            - '../src/Debug/RouteRenderOptions.php'
            - '../src/Core/Geo/GeoIp2MaxMindDatabaseReader.php'
            - '../src/**/*Spec.php'
            - '../src/**/*Status.php'
            - '../src/**/*Type.php'
            - '../src/Security/AdminGroupListQuery.php'
            - '../src/Security/AdminUserListQuery.php'
