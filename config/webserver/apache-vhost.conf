# Apache virtual host template for aavion.studio.
#
# Prefer this server-level configuration over relying on public/.htaccess.
# It works with AllowOverride None and keeps rewrite behavior explicit.

<VirtualHost *:80>
    ServerName studio.local
    DocumentRoot "/path/to/studio/public"

    <Directory "/path/to/studio/public">
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch

        FallbackResource /index.php
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On

        RewriteCond %{HTTP:Authorization} .+
        RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

        RewriteRule ^/index\.php(?:/(.*)|$) /$1 [R=308,L]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/system-error.log
    CustomLog ${APACHE_LOG_DIR}/system-access.log combined
</VirtualHost>
